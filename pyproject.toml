[project]
name = "taktloop"
version = "0.1.0"
description = "Core and MCP server that moves tasks through a YAML-defined workflow"
authors = [
    { name = "Tobias", email = "21081031+medlor@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
]

[project.scripts]
taktloop = "taktloop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["e2e: end-to-end test that runs a real core subprocess"]
