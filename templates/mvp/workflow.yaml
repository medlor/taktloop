start: design
steps:
  design:
    kind: agent
    role: planner
    skill: brainstorming
    instructions: >
      Run brainstorming with the requester until the design doc is written
      and the requester is happy with it. Do not invoke writing-plans.
    output:
      artifacts: [design_doc]        # required artifact names
    next: design_approval
  design_approval:
    kind: human_gate
    role: approver
    approves: design
    on_approve: plan
    on_reject: design                # reopens design as round n+1, with the reason
  plan:
    kind: agent
    role: planner
    skill: writing-plans
    instructions: >
      Write the plan from the approved design doc. Do not ask for an
      execution mode and do not start executing.
    output:
      artifacts: [plan]
    next: plan_review
  plan_review:
    kind: agent
    role: reviewer
    skill: taktloop-plan-review
    instructions: >
      Review the plan against the approved design doc. Return pass or
      issues with concrete findings. Do not edit the plan.
    review_of: plan                # the step whose latest artifact is reviewed
    on_pass: workspace
    on_issues: plan                # reopens plan as round n+1 with the findings
    max_issue_rounds: 2            # the 2nd 'issues' escalates instead
    on_escalate: plan_escalation
  plan_escalation:
    kind: human_gate
    role: approver
    on_approve: workspace          # approve the plan anyway
    on_reject: [plan, design]      # first entry is the default target
  workspace:
    kind: agent
    role: builder
    skill: using-git-worktrees
    instructions: >
      Create the task branch taktloop/<task id>-<short-name> from origin/main,
      verify a clean test baseline, push the branch to origin.
    output: {artifacts: [workspace]}       # path ".", commit = the base commit
    next: build
  build:
    kind: agent
    role: builder
    skill: subagent-driven-development
    instructions: >
      Implement the approved plan on the task branch with test-driven development.
      Commit, push the branch to origin. Do not merge and do not open a pull request.
    output: {artifacts: [change]}          # path ".", commit = the pushed branch head
    next: code_review
  code_review:
    kind: agent
    role: reviewer
    skill: requesting-code-review
    dispatch: push                         # the orchestrator starts an executor
    push: {start: claude-headless, identity: reviewer-bot}
    instructions: >
      Review the change (workspace commit .. change commit) against the plan.
      Return pass, or issues with the critical and important findings. Do not edit code.
    review_of: build
    on_pass: verify
    on_issues: build
    max_issue_rounds: 2
    on_escalate: build_escalation
  build_escalation:
    kind: human_gate
    role: approver
    on_approve: verify                     # accept the change despite the review
    on_reject: [build, plan]
  verify:
    kind: code                             # run by the orchestrator, no LLM
    role: verifier
    call:                                  # the orchestrator's own MCP call
      mcp_server: github
      tool: actions_list
      args:
        method: list_workflow_runs
        owner: medlor
        repo: taktloop
        resource_id: ci.yml
        workflow_runs_filter: {branch: "{{artifacts.change.branch}}"}
      evidence:                            # evidence key: dotted path into the result
        ci_run: workflow_runs.workflow_runs.0.id
    evidence: [ci_run]                     # required evidence keys (§6.3)
    check:                                 # the hard gate (§5)
      mcp_server: github
      tool: actions_get
      args:
        method: get_workflow_run
        owner: medlor
        repo: taktloop
        resource_id: "{{evidence.ci_run}}"
      match:                               # else: refused, nothing changes
        workflow_run.head_sha: "{{artifacts.change.commit}}"
        workflow_run.path: .github/workflows/ci.yml
        workflow_run.status: completed
      expect:                              # else: back to on_fail with the result
        workflow_run.conclusion: success
    next: integration_approval
    on_fail: build
  integration_approval:
    kind: human_gate
    role: approver
    approves: build
    on_approve: integrate
    on_reject: [build, plan]
  integrate:
    kind: agent
    role: builder
    skill: finishing-a-development-branch
    instructions: >
      Merge the change commit (not the branch tip) into main, push main to origin.
      Do not ask which option to take; the approver decided "merge".
    output: {artifacts: [merge]}           # path ".", commit = the merge commit on main
    next: done
